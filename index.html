<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sảnh sexy</title>
<style>
body {
  background: #0b1220;
  font-family: 'Arial', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.container {
  background: #1a1f2c;
  padding: 25px 30px;
  border-radius: 15px;
  box-shadow: 0 0 25px rgba(0,0,0,0.5);
  text-align: center;
  width: 320px;
}
h2 {
  color: #00FFB2;
  margin-bottom: 20px;
}
select {
  padding: 8px 12px;
  border-radius: 8px;
  border: none;
  background: #272c3c;
  color: white;
  font-size: 16px;
  margin-bottom: 15px;
}
button {
  border: none;
  border-radius: 12px;
  padding: 12px 18px;
  font-size: 16px;
  font-weight: bold;
  margin: 5px;
  cursor: pointer;
  transition: 0.2s;
}
button:hover {
  transform: scale(1.05);
}
#btnCon { background: #007BFF; color: white; }
#btnCai { background: #FF3B3B; color: white; }
#calcBtn { background: #00B894; color: white; width: 100%; margin-top: 15px; }
#circle {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  line-height: 100px;
  font-weight: bold;
  font-size: 36px;
  margin: 15px auto;
  color: white;
  background: #00A2FF;
  transition: 0.3s;
}
#result {
  font-family: monospace;
  font-size: 30px;
  color: #00FFB2;
  margin-top: 10px;
}
.overlay {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.9);
  display:flex; align-items:center; justify-content:center; z-index:100;
}
.overlay-frame {
  background:#272c3c; padding:20px; border-radius:12px; text-align:center; position:relative;
}
.overlay-frame button {
  width:50px; height:50px; border-radius:50%; border:none; margin:5px; font-weight:bold; cursor:pointer; color:white; font-size:18px;
  transition: 0.2s;
}
.overlay-frame button:hover { transform: scale(1.1); }
.overlay-close {
  position:absolute; top:8px; right:12px; font-size:22px; cursor:pointer; color:white;
}
</style>
</head>
<body>
<div class="container">
  <h2>Sảnh sexy</h2>
  <div>
    <select id="table">
      <option>BÀN 1</option>
      <option>BÀN C01</option>
      <option>BÀN C05</option>
      <option>BÀN C06</option>
      <option>BÀN C07</option>
    </select>
  </div>
  <div>
    <button id="btnCon">CON 0</button>
    <button id="btnCai">CÁI 0</button>
  </div>
  <button id="calcBtn">TÍNH</button>
  <div id="circle">P</div>
  <div id="result">0000</div>
</div>

<script>
let con = 0, cai = 0;

// --- Công thức ---
function f_ban1(x,y){ return Math.round((-1747/7) + (4504/21)*x - (5/6)*y - (401/21)*(x**2)); }
function f_banC01(x,y){ return Math.round(x + Math.floor((200*y + 2)/7)); }
function f_banC05(a,b){ let P=-0.378,Q=12.522,R=6.4; return Math.round(P*(a**2)+Q*a+R*b+96); }
function f_banC06(x,y){ return Math.round(-9435.9036 + 1372.9237*x + 2314.0843*y - 35.56225*(x**2) - 160.79518*x*y - 139.01205*(y**2)); }
function f_banC07(a,b){ return Math.round(36.65*(a**2) + 7.05*(b**2) - 42.3*a*b); }

function formatResult(x,y,table){
  let val;
  switch(table){
    case "BÀN 1": val=f_ban1(x,y); break;
    case "BÀN C01": val=f_banC01(x,y); break;
    case "BÀN C05": val=f_banC05(x,y); break;
    case "BÀN C06": val=f_banC06(x,y); break;
    case "BÀN C07": val=f_banC07(x,y); break;
  }
  return Math.abs(val).toString().padStart(4,'0');
}

// --- Overlay chọn số ---
function chooseNumber(target){
  let overlay=document.createElement('div'); overlay.className='overlay';
  let frame=document.createElement('div'); frame.className='overlay-frame';
  let close=document.createElement('div'); close.className='overlay-close'; close.textContent='✕';
  close.onclick=()=>document.body.removeChild(overlay);
  frame.appendChild(close);
  let title=document.createElement('div'); title.textContent='Chọn số'; title.style.marginBottom='12px'; title.style.color='#00FFB2'; title.style.fontSize='18px';
  frame.appendChild(title);

  for(let i=0;i<10;i++){
    let btn=document.createElement('button'); btn.textContent=i;
    btn.style.background=target.id==='btnCon'?'#007BFF':'#FF3B3B';
    btn.onclick=()=>{
      if(target.id==='btnCon'){ con=i; target.textContent='CON '+i; }
      else{ cai=i; target.textContent='CÁI '+i; }
      document.body.removeChild(overlay);
    };
    frame.appendChild(btn);
  }

  overlay.appendChild(frame);
  document.body.appendChild(overlay);
}

// --- Hiệu ứng số ---
function animateRandom(finalValue, callback){
  let duration=500,interval=50,steps=duration/interval,counter=0;
  let intv=setInterval(()=>{
    if(counter<steps){
      let str='';
      for(let c of finalValue){ str+=/\d/.test(c)?Math.floor(Math.random()*10):c; }
      document.getElementById('result').textContent=str.padStart(4,'0');
      counter++;
    } else { clearInterval(intv); revealNumber(finalValue,callback); }
  }, interval);
}

function revealNumber(finalValue, callback){
  let display=finalValue.split('').map(c=>/\d/.test(c)?'_':c);
  let index=0;
  function showNext(){
    while(index<finalValue.length && !/\d/.test(finalValue[index])) index++;
    if(index<finalValue.length){
      display[index]=finalValue[index];
      document.getElementById('result').textContent=display.join('');
      index++;
      setTimeout(showNext,80);
    } else callback();
  }
  showNext();
}

// --- Tính toán ---
function calculate(){
  let table=document.getElementById('table').value;
  let resultStr=formatResult(con,cai,table);
  let resultInt=parseInt(resultStr);
  let circle=document.getElementById('circle');
  circle.style.background='#202533'; circle.textContent='?'; document.getElementById('result').textContent='----';

  function showFinal(){
    let even=resultInt%2===0;
    if(["BÀN 1","BÀN C05","BÀN C06"].includes(table)){
      circle.style.background=even?"#00A2FF":"#FF3B3B"; circle.textContent=even?"P":"B";
    } else if(table==="BÀN C01"){
      circle.style.background=even?"#FF3B3B":"#00A2FF"; circle.textContent=even?"B":"P";
    } else{
      circle.style.background=even?"#00A2FF":"#FF3B3B"; circle.textContent=even?"P":"B";
    }
  }

  animateRandom(resultStr, showFinal);
}

// --- Event ---
document.getElementById('btnCon').addEventListener('click',()=>chooseNumber(document.getElementById('btnCon')));
document.getElementById('btnCai').addEventListener('click',()=>chooseNumber(document.getElementById('btnCai')));
document.getElementById('calcBtn').addEventListener('click',calculate);
</script>
</body>
</html>
