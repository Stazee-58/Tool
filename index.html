<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sảnh Sexy • Premium</title>

<style>
:root{
  --bg1:#050914;
  --bg2:#0c1633;
  --glass:rgba(255,255,255,.10);
  --border:rgba(255,255,255,.22);
  --neon:#00ffe0;
  --blue:#00aaff;
  --red:#ff4d4d;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100svh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(120% 60% at top,var(--bg2),var(--bg1));
  font-family:-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif;
  color:white;
}

/* ===== CONTAINER ===== */
.container{
  width:92%;
  max-width:360px;
  padding:24px 22px 26px;
  border-radius:28px;
  background:linear-gradient(
    180deg,
    rgba(255,255,255,.14),
    rgba(255,255,255,.05)
  );
  backdrop-filter:blur(22px) saturate(140%);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  border:1px solid var(--border);
  box-shadow:
    0 30px 60px rgba(0,0,0,.6),
    inset 0 0 0.5px rgba(255,255,255,.6);
  text-align:center;
}

/* ===== TITLE ===== */
h2{
  margin:0 0 18px;
  font-size:20px;
  font-weight:800;
  letter-spacing:1.4px;
  color:var(--neon);
  text-shadow:0 0 16px rgba(0,255,224,.7);
}

/* ===== SELECT ===== */
select{
  width:100%;
  padding:14px 16px;
  border-radius:16px;
  border:1px solid var(--border);
  background:rgba(0,0,0,.35);
  color:white;
  font-size:16px;
  outline:none;
  margin-bottom:18px;
}

/* ===== BUTTON ROW ===== */
.btn-row{
  display:flex;
  gap:14px;
  margin-bottom:18px;
}

button{
  border:none;
  border-radius:18px;
  padding:14px 0;
  font-size:15px;
  font-weight:700;
  color:white;
  cursor:pointer;
  transition:transform .18s, box-shadow .18s;
}

button:active{
  transform:scale(.94);
}

/* ===== BUTTON COLORS ===== */
#btnCon{
  flex:1;
  background:linear-gradient(135deg,#1fb6ff,#007aff);
  box-shadow:0 10px 28px rgba(0,122,255,.55);
}

#btnCai{
  flex:1;
  background:linear-gradient(135deg,#ff5f5f,#ff2d2d);
  box-shadow:0 10px 28px rgba(255,45,45,.55);
}

#calcBtn{
  width:100%;
  margin-bottom:14px;
  background:linear-gradient(135deg,#00ffe0,#00c7a8);
  color:#04332b;
  box-shadow:0 14px 36px rgba(0,255,224,.6);
}

/* ===== RESULT CIRCLE ===== */
#circle{
  margin:18px auto 10px;
  width:118px;
  height:118px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:900;
  background:#0d0f18;
  box-shadow:
    inset 0 0 26px rgba(0,0,0,.9),
    0 0 0 rgba(0,0,0,0);
  transition:.35s;
}

/* ===== NUMBER ===== */
#result{
  font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size:34px;
  letter-spacing:3px;
  color:var(--neon);
  text-shadow:0 0 14px rgba(0,255,224,.8);
}

/* ===== OVERLAY ===== */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.94);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.overlay-frame{
  padding:18px;
  border-radius:24px;
  background:var(--glass);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--border);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}

.overlay-frame button{
  width:52px;
  height:52px;
  border-radius:50%;
  font-size:18px;
  font-weight:800;
  border:none;
  color:white;
}
</style>
</head>

<body>
<div class="container">
  <h2>SẢNH SEXY</h2>

  <select id="table">
    <option>BÀN 1</option>
    <option>BÀN C01</option>
    <option>BÀN C03</option>
    <option>BÀN C05</option>
    <option>BÀN C06</option>
    <option>BÀN C07</option>
  </select>

  <div class="btn-row">
    <button id="btnCon">CON 0</button>
    <button id="btnCai">CÁI 0</button>
  </div>

  <button id="calcBtn">TÍNH KẾT QUẢ</button>

  <div id="circle">?</div>
  <div id="result">----</div>
</div>

<script>
let con=0,cai=0;

function f_ban1(x,y){return Math.round((-1747/7)+(4504/21)*x-(5/6)*y-(401/21)*x*x);}
function f_banC01(x,y){return Math.round(x+Math.floor((200*y+2)/7));}
function f_banC03(a,b){return Math.round(12.7*a*a+9.3*b*b-21.4*a*b+18.6*a+25.1*b+77);}
function f_banC05(a,b){return Math.round(-0.378*a*a+12.522*a+6.4*b+96);}
function f_banC06(x,y){return Math.round(-9435.9+1372.9*x+2314.1*y-35.56*x*x-160.8*x*y-139*y*y);}
function f_banC07(a,b){return Math.round(36.65*a*a+7.05*b*b-42.3*a*b);}

function calcVal(a,b,t){
  return Math.abs(
    t==="BÀN 1"?f_ban1(a,b):
    t==="BÀN C01"?f_banC01(a,b):
    t==="BÀN C03"?f_banC03(a,b):
    t==="BÀN C05"?f_banC05(a,b):
    t==="BÀN C06"?f_banC06(a,b):
    f_banC07(a,b)
  );
}

function pick(isCon){
  let o=document.createElement("div");
  o.className="overlay";
  let f=document.createElement("div");
  f.className="overlay-frame";

  for(let i=0;i<10;i++){
    let b=document.createElement("button");
    b.textContent=i;
    b.style.background=isCon?"#007aff":"#ff3b3b";
    b.onclick=()=>{
      if(isCon){con=i;btnCon.textContent="CON "+i;}
      else{cai=i;btnCai.textContent="CÁI "+i;}
      o.remove();
    };
    f.appendChild(b);
  }
  o.appendChild(f);
  document.body.appendChild(o);
}

function animateNumber(finalValue,cb){
  let c=0;
  let t=setInterval(()=>{
    if(c<12){
      result.textContent=Math.floor(Math.random()*10000).toString().padStart(4,"0");
      c++;
    }else{
      clearInterval(t);
      result.textContent=finalValue;
      cb();
    }
  },60);
}

function calculate(){
  let v=calcVal(con,cai,table.value);
  let even=v%2===0;
  let final=v.toString().padStart(4,"0");

  circle.textContent="?";
  result.textContent="----";

  animateNumber(final,()=>{
    circle.textContent=even?"P":"B";
    circle.style.background=even
      ?"radial-gradient(circle,#00c6ff,#004b75)"
      :"radial-gradient(circle,#ff7676,#7a0000)";
    circle.style.boxShadow=even
      ?"0 0 34px rgba(0,162,255,.9)"
      :"0 0 34px rgba(255,59,59,.9)";
  });
}

btnCon.onclick=()=>pick(true);
btnCai.onclick=()=>pick(false);
calcBtn.onclick=calculate;
</script>
</body>
</html>
