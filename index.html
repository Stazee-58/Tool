<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI Tài Xỉu • Liquid Glass</title>

<style>
:root{
  --bg1:#0a0f2c;
  --bg2:#0b3c2e;
  --glass:rgba(255,255,255,.18);
  --stroke:rgba(255,255,255,.25);
  --txt:#eef2ff;
  --mut:rgba(255,255,255,.65);
  --tai:#3ddc97;
  --xiu:#7c83ff;
  --warn:#ffcc66;
  --bad:#ff6b6b;
}

*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui}
body{
  margin:0;
  background:
    radial-gradient(120% 80% at 20% -10%,#1a3cff44,transparent 40%),
    radial-gradient(100% 70% at 90% 10%,#00ffb344,transparent 45%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  color:var(--txt);
  min-height:100vh;
}

.app{
  max-width:420px;
  margin:auto;
  padding:14px;
}

.header{
  text-align:center;
  margin-bottom:14px;
}
.header h1{
  margin:0;
  font-size:20px;
  font-weight:600;
}
.header p{
  margin:4px 0 0;
  font-size:12px;
  color:var(--mut);
}

.glass{
  background:linear-gradient(
    135deg,
    rgba(255,255,255,.35),
    rgba(255,255,255,.05)
  );
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--stroke);
  border-radius:22px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    0 20px 50px rgba(0,0,0,.35);
}

.card{padding:14px;margin-bottom:14px}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.btn{
  padding:16px;
  border-radius:18px;
  border:1px solid var(--stroke);
  font-size:16px;
  font-weight:600;
  color:white;
  backdrop-filter:blur(12px);
}
.btn:active{transform:scale(.97)}
.btn.tai{background:linear-gradient(135deg,#3ddc97,#1fa774)}
.btn.xiu{background:linear-gradient(135deg,#7c83ff,#4b52d9)}
.btn.warn{background:linear-gradient(135deg,#ffcc66,#c49a2d)}
.btn.bad{background:linear-gradient(135deg,#ff6b6b,#c73c3c)}

.history{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:10px;
}
.dot{
  width:22px;height:22px;
  border-radius:50%;
  display:grid;place-items:center;
  font-size:12px;
  color:white;
}
.dot.tai{background:var(--tai)}
.dot.xiu{background:var(--xiu)}

.kpi{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:10px;
}
.box{
  text-align:center;
  padding:10px;
  border-radius:16px;
  background:rgba(255,255,255,.12);
  border:1px solid var(--stroke);
}
.box .label{font-size:11px;color:var(--mut)}
.box .value{font-size:18px;font-weight:600}

.hint{
  text-align:center;
  font-size:22px;
  font-weight:700;
  margin-top:6px;
}

canvas{width:100%;height:180px}

.footer{
  text-align:center;
  font-size:11px;
  color:var(--mut);
  margin-top:6px;
}
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <h1>AI Tài Xỉu</h1>
    <p>Liquid Glass • Mobile Edition</p>
  </div>

  <div class="glass card">
    <div class="buttons">
      <button class="btn tai" onclick="add('T')">➕ TÀI</button>
      <button class="btn xiu" onclick="add('X')">➕ XỈU</button>
      <button class="btn warn" onclick="undo()">↩ Hoàn tác</button>
      <button class="btn bad" onclick="resetAll()">⟲ Reset</button>
    </div>
    <div class="history" id="hist"></div>
  </div>

  <div class="glass card">
    <div class="kpi">
      <div class="box">
        <div class="label">P(Tài)</div>
        <div class="value" id="pt">–</div>
      </div>
      <div class="box">
        <div class="label">P(Xỉu)</div>
        <div class="value" id="px">–</div>
      </div>
      <div class="box">
        <div class="label">Gợi ý</div>
        <div class="value" id="hint">–</div>
      </div>
    </div>
    <canvas id="chart"></canvas>
    <div class="hint" id="bigHint"></div>
  </div>

  <div class="footer">
    Educational only • Không khuyến khích cờ bạc
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const hist=[];
let chart;

function add(v){hist.push(v);render();}
function undo(){hist.pop();render();}
function resetAll(){hist.length=0;render();}

function probs(){
  const t=hist.filter(x=>x==='T').length;
  const n=hist.length;
  const p=(t+1)/(n+2);
  return {T:p,X:1-p};
}

function markov(){
  if(hist.length<2) return 0.5;
  let TT=0,TX=0,XT=0,XX=0;
  for(let i=1;i<hist.length;i++){
    const a=hist[i-1],b=hist[i];
    if(a==='T'&&b==='T')TT++;
    if(a==='T'&&b==='X')TX++;
    if(a==='X'&&b==='T')XT++;
    if(a==='X'&&b==='X')XX++;
  }
  const last=hist.at(-1);
  const s=last==='T'?TT+TX+2:XT+XX+2;
  return last==='T'?(TT+1)/s:(XT+1)/s;
}

function predict(){
  const p=probs().T;
  const m=markov();
  let T=0.6*p+0.4*m;
  T=Math.min(0.98,Math.max(0.02,T));
  return {T,X:1-T};
}

function drawChart(){
  let ema=0,k=0.25;
  const data=[];
  hist.forEach(x=>{
    ema=ema?k*(x==='T'?1:0)+(1-k)*ema:(x==='T'?1:0);
    data.push(ema);
  });
  if(chart)chart.destroy();
  chart=new Chart(chartEl,{
    type:'line',
    data:{labels:data.map((_,i)=>i+1),
      datasets:[{data,borderWidth:2}]},
    options:{
      plugins:{legend:{display:false}},
      scales:{y:{min:0,max:1}},
      responsive:true
    }
  });
}

const chartEl=document.getElementById('chart');

function render(){
  histEl.innerHTML='';
  hist.slice(-40).forEach(x=>{
    const d=document.createElement('div');
    d.className='dot '+(x==='T'?'tai':'xiu');
    d.textContent=x;
    histEl.appendChild(d);
  });
  const r=predict();
  pt.textContent=(r.T*100).toFixed(1)+'%';
  px.textContent=(r.X*100).toFixed(1)+'%';
  hint.textContent=r.T>r.X?'Tài':'Xỉu';
  bigHint.textContent=r.T>r.X?'NÊN ĐÁNH TÀI':'NÊN ĐÁNH XỈU';
  drawChart();
}

const histEl=document.getElementById('hist');
render();
</script>
</body>
</html>
