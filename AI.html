<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tool</title>

<style>
:root{
 --glass-border: rgba(255,255,255,0.22);
}

*{
 box-sizing:border-box;
 font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
}

body{
 min-height:100vh;
 margin:0;
 display:flex;
 justify-content:center;
 align-items:center;
 background:
  radial-gradient(1200px 600px at top, #1e3a8a, #020617),
  linear-gradient(180deg,#020617,#000);
 color:#e5e7eb;
}

.app{
 width:100%;
 max-width:420px;
 padding:16px;
}

/* ===== LIQUID GLASS CARD ===== */
.card{
 position:relative;
 overflow:hidden;
 border-radius:22px;
 padding:16px;
 margin-bottom:14px;

 background:
  linear-gradient(
   120deg,
   rgba(255,255,255,.18),
   rgba(255,255,255,.06),
   rgba(255,255,255,.14)
  );

 backdrop-filter: blur(22px) saturate(140%);
 -webkit-backdrop-filter: blur(22px) saturate(140%);
 border:1px solid var(--glass-border);

 box-shadow:
  inset 0 1px 0 rgba(255,255,255,.35),
  inset 0 -20px 40px rgba(255,255,255,.05),
  0 25px 50px rgba(0,0,0,.55);

 animation: liquidShift 10s ease-in-out infinite;
 transition: transform .2s ease;
}

/* liquid blobs */
.card::after{
 content:"";
 position:absolute;
 inset:-40%;
 background:
  radial-gradient(circle at 30% 30%, rgba(255,255,255,.18), transparent 40%),
  radial-gradient(circle at 70% 60%, rgba(255,255,255,.12), transparent 45%),
  radial-gradient(circle at 50% 90%, rgba(255,255,255,.1), transparent 50%);
 opacity:.35;
 filter: blur(40px);
 animation: liquidMove 14s linear infinite;
 pointer-events:none;
}

/* shine */
.card::before{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(
  120deg,
  transparent 35%,
  rgba(255,255,255,.45),
  transparent 65%
 );
 opacity:.18;
 transform:translateX(-120%);
 animation: shineMove 7s ease-in-out infinite;
 pointer-events:none;
}

/* ===== ANIMATION ===== */
@keyframes liquidShift{
 0%{background-position:0% 50%}
 50%{background-position:100% 50%}
 100%{background-position:0% 50%}
}

@keyframes liquidMove{
 0%{transform:translate(0,0)}
 50%{transform:translate(6%,4%)}
 100%{transform:translate(0,0)}
}

@keyframes shineMove{
 0%{transform:translateX(-120%)}
 50%{transform:translateX(120%)}
 100%{transform:translateX(120%)}
}

/* ===== HEADER ===== */
h1{
 text-align:center;
 margin:6px 0 16px;
 font-size:22px;
 letter-spacing:.5px;
}

/* ===== INPUT ===== */
input{
 width:100%;
 padding:14px;
 border-radius:14px;
 border:1px solid var(--glass-border);
 background:rgba(0,0,0,.25);
 color:#fff;
 font-size:16px;
 outline:none;
}

input::placeholder{color:#94a3b8}

/* ===== BUTTON ===== */
button{
 width:100%;
 padding:14px;
 margin-top:10px;
 border-radius:16px;
 border:1px solid var(--glass-border);
 background:rgba(255,255,255,.14);
 color:#fff;
 font-size:15px;
 font-weight:600;
 backdrop-filter: blur(12px);
 cursor:pointer;
 transition:.2s;
}

button:active{
 transform:scale(.97);
 background:rgba(255,255,255,.22);
}

.btn-green{background:rgba(16,185,129,.28)}
.btn-win{background:rgba(34,197,94,.4)}
.btn-lose{background:rgba(239,68,68,.4)}
.btn-reset{background:rgba(148,163,184,.3)}

.row{
 display:flex;
 gap:10px;
}

/* ===== PREDICT ===== */
.predict{
 text-align:center;
 font-size:28px;
 font-weight:700;
 margin:14px 0;
 animation:pulseGlow 1.6s ease-in-out infinite;
}

@keyframes pulseGlow{
 0%{text-shadow:0 0 10px rgba(255,255,255,.25)}
 50%{text-shadow:0 0 26px rgba(96,165,250,.75)}
 100%{text-shadow:0 0 10px rgba(255,255,255,.25)}
}

/* ===== HISTORY ===== */
.history{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:10px;
}

.cell{
 width:38px;
 height:38px;
 border-radius:12px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:700;
 backdrop-filter: blur(10px);
 box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
}

.T{background:rgba(59,130,246,.65)}
.X{background:rgba(244,63,94,.65)}

/* ===== STAT ===== */
.stat{
 display:flex;
 justify-content:space-between;
 margin-top:6px;
 font-size:15px;
 color:#cbd5f5;
}

.warn{
 text-align:center;
 margin-top:6px;
 color:#fca5a5;
 font-size:14px;
}
</style>
</head>

<body>
<div class="app">
<h1>🧠 Tool</h1>

<div class="card">
 <b>🎲 Nhập 5 ván gốc</b>
 <input id="baseInput" placeholder="VD: TTTXT" />
 <button class="btn-green" onclick="initAI()">KHỞI TẠO AI</button>
</div>

<div class="card">
 <b>🔮 Dự đoán</b>
 <div id="predict" class="predict">---</div>
 <div class="row">
  <button class="btn-win" onclick="confirmResult(true)">THẮNG</button>
  <button class="btn-lose" onclick="confirmResult(false)">THUA</button>
 </div>
 <button class="btn-reset" onclick="resetAll()">RESET</button>
 <div id="warn" class="warn"></div>
</div>

<div class="card">
 <b>📜 Lịch sử (9 ván)</b>
 <div id="history" class="history"></div>
</div>

<div class="card">
 <b>📊 Thống kê</b>
 <div class="stat"><span>Tổng ván</span><span id="total">0</span></div>
 <div class="stat"><span>Win</span><span id="win">0</span></div>
 <div class="stat"><span>Winrate</span><span id="rate">0%</span></div>
</div>
</div>

<script>
let data={visible:[],hidden:[],win:0,total:0};
let predictPick="T";

function initAI(){
 const input=document.getElementById("baseInput");
 let raw=input.value.toUpperCase().replace(/[^TX]/g,"");
 if(raw.length<5){alert("Nhập đủ 5 ván");return;}
 data.visible=[]; data.hidden=[];
 raw.split("").forEach(v=>pushHistory(v));
 input.disabled=true;
 analyze(); render();
}

function pushHistory(v){
 if(data.visible.length>=9) data.hidden.push(data.visible.shift());
 data.visible.push(v);
}

function analyze(){
 const h=[...data.hidden,...data.visible];
 const predict=document.getElementById("predict");
 if(!h.length){predict.innerText="---";return;}

 let score=0,last=h[h.length-1],streak=1;
 for(let i=h.length-2;i>=0;i--){
  if(h[i]===last) streak++; else break;
 }
 if(streak>=2) score+=last==="T"?2:-2;

 let t=h.filter(x=>x==="T").length;
 score+=t>(h.length-t)?1:-1;

 if(h.length>=3){
  let a=h.slice(-3);
  if(a[0]===a[2]&&a[0]!==a[1])
   score+=a[0]==="T"?1:-1;
 }

 predictPick=score>=0?"T":"X";
 predict.innerText=predictPick==="T"?"🔥 TÀI":"❄️ XỈU";
}

function confirmResult(win){
 if(!data.visible.length) return;
 let real;
 if(win){real=predictPick;data.win++;}
 else{real=predictPick==="T"?"X":"T";}
 pushHistory(real);
 data.total++;
 analyze(); render();
}

function resetAll(){
 if(!confirm("Reset toàn bộ AI?")) return;
 data={visible:[],hidden:[],win:0,total:0};
 document.getElementById("baseInput").value="";
 document.getElementById("baseInput").disabled=false;
 document.getElementById("predict").innerText="---";
 render();
}

function render(){
 const history=document.getElementById("history");
 history.innerHTML="";
 data.visible.forEach(v=>{
  let d=document.createElement("div");
  d.className="cell "+v;
  d.innerText=v;
  history.appendChild(d);
 });

 document.getElementById("total").innerText=data.total;
 document.getElementById("win").innerText=data.win;
 let rate=data.total?Math.round(data.win/data.total*100):0;
 document.getElementById("rate").innerText=rate+"%";
 document.getElementById("warn").innerText=
  rate<50 && data.total>5 ? "⚠ Winrate thấp, nên dừng" : "";
}

/* ===== GLASS TILT ===== */
document.querySelectorAll(".card").forEach(card=>{
 card.addEventListener("mousemove",e=>{
  const r=card.getBoundingClientRect();
  const x=e.clientX-r.left;
  const y=e.clientY-r.top;
  const rx=((y/r.height)-0.5)*-6;
  const ry=((x/r.width)-0.5)*6;
  card.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;
 });
 card.addEventListener("mouseleave",()=>{
  card.style.transform="rotateX(0) rotateY(0)";
 });
});
</script>
</body>
</html>
